<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>야행 v104 · 시야·휘파람·선택 표시</title><style>*{box-sizing:border-box}body{margin:0;background:#eee4cf;color:#171817;font:15px/1.65 system-ui,sans-serif}main{max-width:1280px;margin:auto;padding:24px 16px}h1{font-size:28px;margin:0 0 12px}p{color:#625a49}a{color:#94382b}nav{display:flex;gap:8px;flex-wrap:wrap}button{font:inherit;padding:8px 14px;min-height:44px;cursor:pointer;background:none;border:1px solid #8f8064}button[aria-pressed=true]{background:#171817;color:#eee4cf}.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}figure{margin:0}figcaption{font-size:13px;margin:8px 0}img{display:block;width:100%;border:1px solid #8f8064}.mobile img{max-width:390px;margin:auto}details{margin-top:24px}summary{cursor:pointer;padding:8px 0}@media(max-width:760px){.pair{grid-template-columns:1fr}}</style><main><h1>시야·휘파람·선택 표시 · v104</h1><p>밝은 곳의 시야를 늘리고, 문 옆 휘파람 반응과 기절자 선택 표시를 맞췄습니다.</p><p><a href="../tone-study/game.html?v=104">잉크 시안 플레이</a> · <a href="../?v=104">기본 버전 플레이</a></p><nav><button data-scene="whistle">휘파람 반응</button><button data-scene="body">기절자 선택</button><button data-scene="bright">밝은 곳 시야</button><button data-scene="dark">어두운 곳 시야</button><button data-w="390">모바일</button><button data-w="1280">PC</button></nav><p id="note"></p><div class="pair" id="pair"><figure><figcaption>이전 v103</figcaption><a id="beforeLink"><img id="before"></a></figure><figure><figcaption>수정 v104</figcaption><a id="afterLink"><img id="after"></a></figure></div><p>같은 배치의 브라우저 화면입니다. 휘파람과 기절자 이동을 실제 상태로 실행했습니다. 시야 비교는 동일한 고정 밝기를 적용한 거리 테스트 장면입니다. 이미지를 누르면 원본을 볼 수 있습니다.</p></main><script>const copy={whistle:'VIP 문 옆 한 칸에서 부른 휘파람. 소리가 열린 출입구를 돌아 전달되며, 들은 적이 방향을 돌려 확인합니다.',body:'운반·이동 후에도 실제로 누워 있는 그림의 중심에 선택 테두리가 붙습니다. 같은 대상을 가리키는 중복 테두리는 줄였습니다.',bright:'같은 조명과 위치에서 거리 비교. 보통 난이도의 밝은 곳 시야는 약 5.6칸에서 11.7칸으로 늘었습니다. 실제 문·벽의 시야 가림은 유지합니다.',dark:'어둠에서는 시야가 짧습니다. 밝은 곳의 시야만 멀리 늘리고, 어둠의 기본 범위는 유지했습니다.'};let scene='whistle',width=innerWidth<=700?'390':'1280';function render(){for(const when of ['before','after']){const src=scene+'-'+when+'-'+width+'.png';document.getElementById(when).src=src;document.getElementById(when).alt=(when==='before'?'이전':'수정')+' '+document.querySelector('[data-scene="'+scene+'"]').textContent+' '+width+'px';document.getElementById(when+'Link').href=src;}document.getElementById('pair').classList.toggle('mobile',width==='390');document.getElementById('note').textContent=copy[scene];document.querySelectorAll('[data-scene]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.scene===scene)));document.querySelectorAll('[data-w]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.w===width)));}document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>{scene=b.dataset.scene;render()});document.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{width=b.dataset.w;render()});render();</script></html>
