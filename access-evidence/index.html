<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>야행 · 막힌 골목 수정</title><style>*{box-sizing:border-box}body{margin:0;background:#101317;color:#e8e5dc;font:16px/1.6 system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:28px 18px}h1{font-size:24px;margin:0 0 8px}p{color:#bfc1bf}a{color:#ebcc83}.compare{display:grid;grid-template-columns:1fr 1fr;gap:20px}figure{margin:0}figcaption{padding:8px 0;font-weight:600}img{width:100%;height:auto;border:1px solid #34393d}footer{margin-top:24px}@media(max-width:560px){.compare{grid-template-columns:1fr}}</style><main><h1>골목 북쪽을 큰길로 연결했습니다</h1><p>같은 맵·좌표의 실제 게임 화면입니다. 입구를 막던 두꺼비집을 옆으로 옮겨, 남쪽 빗장을 열지 않아도 위쪽 큰길로 나올 수 있습니다. 옆 골목의 수거함도 같은 기준으로 정리했습니다.</p><div class="compare"><figure><figcaption>이전 · 북쪽 입구가 막힘</figcaption><a href="before.png"><img src="before.png" width="620" height="920" alt="이전: 골목 북쪽을 두꺼비집이 가로막고 남쪽 쪽문도 잠긴 모습"></a></figure><figure><figcaption>수정 · 북쪽 큰길로 통행</figcaption><a href="after.png"><img src="after.png" width="620" height="920" alt="수정: 두꺼비집이 왼쪽으로 이동해 골목에서 큰길로 이어지는 통로가 열린 모습"></a></figure></div><footer><p>기존 저장에서도 통로를 복구합니다. 싸움 뒤 공격 동작이 남는 문제와 목격 없는 범인 인지 판정도 함께 수정했습니다.</p><a href="../?v=90">게임 실행 · v90</a></footer></main></html>
