<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>야행 v102 · 행동 안내와 배관 오르기</title><style>*{box-sizing:border-box}body{margin:0;background:#eee4cf;color:#171817;font:15px/1.65 system-ui,sans-serif}main{max-width:1280px;margin:auto;padding:24px 16px}h1{font-size:28px;margin:0 0 12px}p{color:#625a49}a{color:#94382b}nav{display:flex;gap:8px;flex-wrap:wrap}button{font:inherit;padding:8px 14px;min-height:44px;cursor:pointer;background:none;border:1px solid #8f8064}button[aria-pressed=true]{background:#171817;color:#eee4cf}.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}figure{margin:0}figcaption{font-size:13px;margin:8px 0}img{display:block;width:100%;border:1px solid #8f8064}.mobile img{max-width:390px;margin:auto}details{margin-top:24px}summary{cursor:pointer;padding:8px 0}@media(max-width:760px){.pair{grid-template-columns:1fr}}</style><main><h1>행동 안내와 배관 오르기 · v102</h1><p>큰 배경판을 없애고 가능한 조작만 표시했습니다. 배관 오르기의 잘린 머리와 팔도 복원했습니다.</p><p><a href="../tone-study/game.html?v=102">잉크 시안 플레이</a> · <a href="../?v=102">기본 버전 플레이</a></p><nav><button data-scene="near">적 접근</button><button data-scene="captive">심문 후</button><button data-scene="pipe-close">오르기 확대</button><button data-scene="pipe">오르기 전체</button><button data-w="390">모바일</button><button data-w="1280">PC</button></nav><p id="note"></p><div class="pair" id="pair"><figure><figcaption>이전 v101</figcaption><a id="beforeLink"><img id="before"></a></figure><figure><figcaption>수정 v102</figcaption><a id="afterLink"><img id="after"></a></figure></div><p>동일한 배치의 브라우저 화면입니다. 배관 이동과 붙잡기·심문을 실제 실행해 촬영했습니다. 이미지를 누르면 원본을 볼 수 있습니다.</p></main><script>const copy={near:'모바일은 공격 · 붙잡기 · 행동만, PC는 키와 동작만 표시합니다. 공통 배경판과 설명 줄은 없습니다.',captive:'심문을 마치면 공격만 남습니다. 추가 정보 없음이나 불가능한 행동은 표시하지 않습니다.',"pipe-close":'동일한 배관 이동 시점 확대. 촬영 범위와 기준점을 바로잡아 머리와 들어 올린 손을 함께 담았습니다.',pipe:'실제 배관 이동 화면입니다.'};let scene='near',width=innerWidth<=700?'390':'1280';function render(){for(const when of ['before','after']){const src=scene+'-'+when+'-'+width+'.png';document.getElementById(when).src=src;document.getElementById(when).alt=(when==='before'?'이전':'수정')+' '+document.querySelector('[data-scene="'+scene+'"]').textContent+' '+width+'px';document.getElementById(when+'Link').href=src;}document.getElementById('pair').classList.toggle('mobile',width==='390');document.getElementById('note').textContent=copy[scene];document.querySelectorAll('[data-scene]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.scene===scene)));document.querySelectorAll('[data-w]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.w===width)));}document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>{scene=b.dataset.scene;render()});document.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{width=b.dataset.w;render()});render();</script></html>
