<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>야행 v103 · 배관 접점 수정</title><style>*{box-sizing:border-box}body{margin:0;background:#eee4cf;color:#171817;font:15px/1.6 system-ui,sans-serif}main{max-width:1280px;margin:auto;padding:24px 16px}h1{font-size:26px}p{color:#625a49}a{color:#94382b}nav{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}button{font:inherit;padding:8px 12px;min-height:44px;cursor:pointer;background:none;border:1px solid #8f8064}button[aria-pressed=true]{background:#171817;color:#eee4cf}.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:20px 0}figure{margin:0}figcaption{margin:8px 0}img{display:block;max-width:100%;width:200px}.full img{width:100%}.full.mobile img{max-width:390px}@media(max-width:580px){.pair.full{grid-template-columns:1fr}}</style><main><h1>배관을 잡는 위치 · v103</h1><p>옆벽에서도 벽을 향해 서고, 두 손의 접점을 실제 관 축에 맞췄습니다.</p><p><a href="../tone-study/game.html?v=103">게임 실행</a> · <a href="https://github.com/kkhkkh20-bit/yahaeng/blob/main/docs/PIPE_CONTACTS.md">변경·검증 내역</a></p><nav><button data-scene="side">옆벽 배관</button><button data-scene="gas">정면 가스관</button><button data-width="390">모바일</button><button data-width="1280">PC</button></nav><nav><button data-frame="06">접근</button><button data-frame="18">붙잡기</button><button data-frame="38">오르기</button><button data-frame="62">후반</button><button data-frame="79">관 끝</button><button data-frame="90">넘기</button><button data-frame="100">착지</button><button data-frame="down">내려오기</button><button data-frame="full">전체 화면</button></nav><div class="pair" id="pair"><figure><figcaption>이전 v102</figcaption><a id="beforeLink"><img id="before" alt="이전 배관 동작"></a></figure><figure><figcaption>수정 v103</figcaption><a id="afterLink"><img id="after" alt="수정 배관 동작"></a></figure></div><p>같은 배관에서 실제 오르내리기 동작을 진행한 브라우저 화면입니다. 동작 길이가 달라 같은 진행 비율로 비교했습니다. 이미지를 누르면 원본이 열립니다.</p></main><script>let scene='side',frame='38',width=innerWidth<700?'390':'1280';function render(){for(const when of ['before','after']){const file=frame==='full'?`${scene}-full-${when}-${width}.png`:frame==='down'?`${scene}-down-${when}-${width}.png`:`${scene}-${when}-${frame}-${width}.png`;document.getElementById(when).src=file;document.getElementById(when+'Link').href=file;}document.getElementById('pair').classList.toggle('full',frame==='full');document.getElementById('pair').classList.toggle('mobile',width==='390');for(const [key,value]of Object.entries({scene,frame,width}))document.querySelectorAll(`[data-${key}]`).forEach(b=>b.setAttribute('aria-pressed',String(b.dataset[key]===value)));}document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>{scene=b.dataset.scene;render()});document.querySelectorAll('[data-frame]').forEach(b=>b.onclick=()=>{frame=b.dataset.frame;render()});document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>{width=b.dataset.width;render()});render();</script></html>
