<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>야행 · 마지막 정산</title><style>body{margin:0;background:#111c1f;color:#ded7c7;font:16px/1.75 system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:32px 20px}h1{font-weight:500;letter-spacing:-.05em}a{color:#e2c793}nav{display:flex;gap:24px;flex-wrap:wrap;margin:20px 0 36px}figure{margin:36px 0}img{display:block;width:100%;height:auto;border:1px solid #45534b}figcaption{color:#aab5ac;margin:9px 0}.mobile{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.mobile figure{margin:0}@media(max-width:600px){main{padding:22px 14px}.mobile{gap:10px}}</style><main><p>야행 · 에피소드 01</p><h1>마지막 정산</h1><p>폐점한 클럽. 송대건을 처치하고 원본 장부를 회수한 뒤 빠져나간다.</p><nav><a href="../episode-one/?v=132">플레이</a><a href="https://github.com/kkhkkh20-bit/yahaeng/blob/main/docs/EPISODE_ONE.md">기획·검수</a><a href="../club-study/?v=132">기존 구역</a></nav><figure><img src="staff-brief.webp" alt="마지막 정산의 짧은 브리핑과 두 필수 목표"><figcaption>소개는 한 문단, 목표는 두 개. 접근 순서는 정해져 있지 않다.</figcaption></figure><figure><img loading="lazy" src="staff-desk-note.webp" alt="책상 위 메모와 직원 출입문"><figcaption>책상에서 얻는 비밀번호. 직원 출입문을 열거나 다른 진입로를 찾는다.</figcaption></figure><figure><img loading="lazy" src="staff-stairs.webp" alt="2층 정산실의 송대건과 경비 동선"><figcaption>표적은 책상과 창가를 오가고 순찰이 같은 공간을 지난다.</figcaption></figure><div class="mobile"><figure><img loading="lazy" src="window-sewer.webp" alt="모바일 맨홀 우회"><figcaption>맨홀로 골목을 우회한다.</figcaption></figure><figure><img loading="lazy" src="window-window-entry.webp" alt="모바일 2층 창문 진입"><figcaption>열린 창문으로 정산실에 들어간다.</figcaption></figure></div><figure><img loading="lazy" src="staff-complete.webp" alt="실제 AI를 켠 번호판 계단 경로의 임무 완료"><figcaption>PC·모바일 완주, 기절/처치 구분, 재시작과 소개 화면 복귀를 검사했다. 완주 검사는 시뮬레이션 시간을 빠르게 진행하며 실제 휴대폰 FPS나 신규 플레이 분량의 측정이 아니다.</figcaption></figure></main>
