><a href="cellar.png"><img src="cellar.png" alt="지하 · 저장고와 감방의 실제 게임 화면" loading="lazy"></a><h2>지하 · 저장고와 감방</h2><figcaption>주방의 지하 계단과 연결되는 감방 3개. 기절한 인물을 운반해 수감합니다.</figcaption></figure></div><footer>PC·모바일 영업·약물·수감·다층 이동 기능 검증 86개, 빌드 검증 7개 통과. 각 이미지를 누르면 원본 화면을 봅니다.</footer></main></body></html>
