<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>야행 v143 · 층과 옥상 추적</title><style>body{max-width:1200px;margin:auto;padding:24px;background:#151b17;color:#e3e5da;font:16px/1.6 system-ui,sans-serif}a{color:#d2d8be}h1{font-size:28px}h2{margin-top:36px;font-size:21px}.pair{display:grid;grid-template-columns:3fr 1fr;gap:20px}figure{margin:0}figcaption{margin-bottom:8px}img{width:100%;height:auto}p{max-width:75ch}@media(max-width:650px){.pair{grid-template-columns:1fr}}</style><h1>야행 v143 · 층과 옥상 추적</h1><p>실제 클럽 지도의 통제된 브라우저 캡처다. 시야 관통을 막고, 경비가 마지막 목격 위치의 층까지 실제로 이동하도록 수정했다.</p><p><a href="../?v=143">게임 실행</a> · <a href="multilevel-pursuit.json">119개 경로·시야 검사</a> · <a href="regressions.txt">회귀 검사 원본</a></p><h2>옥상 중앙 차폐</h2><p>아래쪽 경비의 시선이 지붕을 관통하지 않는다.</p><div class="pair"><figure><figcaption>PC</figcaption><a href="middle-pc.png"><img src="middle-pc.png" alt="옥상 중앙 차폐 PC" loading="lazy"></a></figure><figure><figcaption>터치</figcaption><a href="middle-touch.png"><img src="middle-touch.png" alt="옥상 중앙 차폐 터치" loading="lazy"></a></figure></div><h2>가장자리 노출</h2><p>실제로 보이는 가장자리에서의 발견은 유지한다.</p><div class="pair"><figure><figcaption>PC</figcaption><a href="edge-pc.png"><img src="edge-pc.png" alt="가장자리 노출 PC" loading="lazy"></a></figure><figure><figcaption>터치</figcaption><a href="edge-touch.png"><img src="edge-touch.png" alt="가장자리 노출 터치" loading="lazy"></a></figure></div><h2>옥상 도착</h2><p>마지막 목격 위치를 받은 경비가 계단을 통해 옥상에 도착한 통제 시나리오다.</p><div class="pair"><figure><figcaption>PC</figcaption><a href="pursuit-pc.png"><img src="pursuit-pc.png" alt="옥상 도착 PC" loading="lazy"></a></figure><figure><figcaption>터치</figcaption><a href="pursuit-touch.png"><img src="pursuit-touch.png" alt="옥상 도착 터치" loading="lazy"></a></figure></div></html>
