<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>야행 · 동작과 창문 v107</title><style>*{box-sizing:border-box}body{margin:0;background:#eee4cf;color:#171817;font:15px/1.65 system-ui,sans-serif}main{max-width:1280px;margin:auto;padding:24px 16px}h1{font-size:28px;margin:0 0 12px}p{color:#625a49}a{color:#94382b}nav{display:flex;gap:8px;flex-wrap:wrap}button{font:inherit;padding:8px 14px;min-height:44px;cursor:pointer;background:none;border:1px solid #8f8064}button[aria-pressed=true]{background:#171817;color:#eee4cf}.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}figure{margin:0}figcaption{font-size:13px;margin:8px 0}img,video{display:block;width:100%;border:1px solid #8f8064}.mobile img,.mobile video{max-width:390px;margin:auto}details{margin-top:28px}summary{cursor:pointer;padding:8px 0}.states img{max-width:300px;margin:auto}[hidden]{display:none!important}@media(max-width:760px){.pair{grid-template-columns:1fr}}</style><main><h1>동작과 창문 · v107</h1><p><a href="../tone-study/game.html?v=107">게임 실행</a> · <a href="https://github.com/kkhkkh20-bit/yahaeng/blob/main/docs/MOTION_WINDOWS.md">점검 기록</a></p><nav><button data-scene="window">창문 통과</button><button data-scene="climb">2층 출입</button><button data-scene="hang">매달림</button><button data-scene="carry">운반</button><button data-w="390">모바일</button><button data-w="1280">PC</button></nav><p id="note"></p><div class="pair mobile" id="pair"><figure><figcaption>이전 v106</figcaption><video id="beforeVideo" muted loop playsinline controls autoplay></video><a id="beforeLink"><img id="before" hidden></a></figure><figure><figcaption>수정 v107</figcaption><video id="afterVideo" muted loop playsinline controls autoplay></video><a id="afterLink"><img id="after" hidden></a></figure></div><p>같은 맵·시작 위치·배치를 사용한 실제 게임 화면입니다. 영상은 브라우저에서 동작 시간을 일정하게 진행해 24fps로 촬영했습니다. 사진은 창문 통과의 50%, 2층 진입의 82% 지점입니다. 매달림·운반은 동작 부분을 잘라 확대했습니다. 이미지를 누르면 전체 화면이 열립니다.</p><details><summary>창문 상태 비교</summary><div class="pair states"><figure><figcaption>열림 · 이전</figcaption><img src="window-open-before.png" loading="lazy" alt="이전 열린 창문"></figure><figure><figcaption>열림 · 수정</figcaption><img src="window-open-after.png" loading="lazy" alt="수정 열린 창문"></figure><figure><figcaption>잠김 · 이전</figcaption><img src="window-lock-before.png" loading="lazy" alt="이전 잠긴 창문"></figure><figure><figcaption>잠김 · 수정</figcaption><img src="window-lock-after.png" loading="lazy" alt="수정 잠긴 창문"></figure><figure><figcaption>방범창 · 이전</figcaption><img src="window-bar-before.png" loading="lazy" alt="이전 방범창"></figure><figure><figcaption>방범창 · 수정</figcaption><img src="window-bar-after.png" loading="lazy" alt="수정 방범창"></figure></div></details></main><script>const copy={window:'창틀 정면으로 접근 → 넘기 → 착지. 이동 중에도 실내가 열리고 몸이 지붕에 가려지지 않습니다.',climb:'창틀을 넘는 진행도에 맞춰 층과 실내 화면을 바꿉니다. 착지까지 동작을 이어 보여 줍니다.',hang:'손·발이 이미지 끝에서 잘리지 않도록 다시 촬영하고, 방향·복장·프레임별 두 손을 전선과 창틀에 맞췄습니다.',carry:'운반과 제압 등 두 사람 동작의 촬영 여백을 넓혔습니다. 게임 안 인물 크기와 위치는 배율·기준점으로 맞춥니다.'};let scene='window',width='390';function render(){const moving=width==='390'&&['window','climb'].includes(scene);for(const when of ['before','after']){const v=document.getElementById(when+'Video'),im=document.getElementById(when);v.hidden=!moving;im.hidden=moving;if(moving){v.src=scene+'-'+when+'.mp4';v.play().catch(()=>{});}else{v.pause();const src=scene+'-'+when+'-'+width+'.png';im.src=['hang','carry'].includes(scene)?scene+'-close-'+when+'-'+width+'.png':src;im.alt=(when==='before'?'이전':'수정')+' '+document.querySelector('[data-scene="'+scene+'"]').textContent;document.getElementById(when+'Link').href=src;}}document.getElementById('pair').classList.toggle('mobile',width==='390');document.getElementById('note').textContent=copy[scene];document.querySelectorAll('[data-scene]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.scene===scene)));document.querySelectorAll('[data-w]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.w===width)));}document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>{scene=b.dataset.scene;render()});document.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{width=b.dataset.w;render()});render();</script></html>
