<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>야행 v101 · 설명과 옵션 정리</title><style>*{box-sizing:border-box}body{margin:0;background:#eee4cf;color:#171817;font:15px/1.65 system-ui,sans-serif}main{max-width:1280px;margin:auto;padding:24px 16px}h1{font-size:28px;margin:0 0 12px}p{color:#625a49}a{color:#94382b}nav{display:flex;gap:8px;flex-wrap:wrap}button{font:inherit;padding:8px 14px;min-height:44px;cursor:pointer;background:none;border:1px solid #8f8064}button[aria-pressed=true]{background:#171817;color:#eee4cf}.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}figure{margin:0}figcaption{font-size:13px;margin:8px 0}img{display:block;width:100%;border:1px solid #8f8064}.mobile img{max-width:390px;margin:auto}details{margin-top:24px}summary{cursor:pointer;padding:8px 0}@media(max-width:760px){.pair{grid-template-columns:1fr}}</style><main><h1>설명과 옵션 정리 · v101</h1><p>지금 할 수 있는 행동과 필요한 상태만 먼저 보이게 정리했습니다.</p><p><a href="../tone-study/game.html?v=101">잉크 시안 플레이</a> · <a href="../?v=101">기본 버전 플레이</a></p><nav><button data-scene="settings">설정</button><button data-scene="ledger">의뢰 목록</button><button data-scene="captive">붙잡은 상태</button><button data-scene="result">결과</button><button data-w="390">모바일</button><button data-w="1280">PC</button></nav><p id="note"></p><div class="pair" id="pair"><figure><figcaption>이전 v100</figcaption><a id="beforeLink"><img id="before"></a></figure><figure><figcaption>수정 v101</figcaption><a id="afterLink"><img id="after"></a></figure></div><details><summary>레퍼런스와 기준</summary><p><a href="https://github.com/charc0al/HitmanCleanUI/blob/ea31cc73c1af16ffa6481882433e29b163916b59/smf/vanilla.webp">HITMAN 기본 상호작용 화면</a>과 <a href="https://github.com/charc0al/HitmanCleanUI/blob/ea31cc73c1af16ffa6481882433e29b163916b59/smf/npc_interaction.webp">NPC 상호작용 비교</a>에서 키·행동·대상의 짧은 구분을 참고했습니다. 붙잡기와 길게 눌러 처치는 계속 표시합니다.</p><p><a href="https://github.com/kkhkkh20-bit/yahaeng/blob/main/docs/UI_EDIT.md">변경·검증 내역</a></p></details><p>동일한 상태를 배치한 브라우저 화면입니다. 붙잡기는 실제 제압·심문을 실행한 장면이며, 결과는 화면 구성 확인용 상태입니다. 이미지를 누르면 원본을 볼 수 있습니다.</p></main><script>const copy={settings:'기본 항목 9→3. 음량·밝기·전체 화면부터 보이고, 조작과 고급 설정은 펼쳐서 확인합니다.',ledger:'의뢰를 먼저 고릅니다. 빈 별점과 미획득 장비를 덜어내고, 재도전 조건은 클리어한 뒤에 표시합니다.',captive:'심문을 마친 뒤에는 실행할 행동만 남깁니다. 기절과 길게 처치의 구분은 유지합니다.',result:'핵심 지표는 최대 4개. 칭호·세부 통계·정산 내역은 상세 기록에서 확인합니다.'};let scene='settings',width=innerWidth<=700?'390':'1280';function render(){for(const when of ['before','after']){const src=scene+'-'+when+'-'+width+'.png';document.getElementById(when).src=src;document.getElementById(when).alt=(when==='before'?'이전':'수정')+' '+document.querySelector('[data-scene="'+scene+'"]').textContent+' '+width+'px';document.getElementById(when+'Link').href=src;}document.getElementById('pair').classList.toggle('mobile',width==='390');document.getElementById('note').textContent=copy[scene];document.querySelectorAll('[data-scene]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.scene===scene)));document.querySelectorAll('[data-w]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.w===width)));}document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>{scene=b.dataset.scene;render()});document.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{width=b.dataset.w;render()});render();</script></html>
