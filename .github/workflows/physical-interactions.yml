name: Physical interaction verification
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - 'build.py'
      - 'VERSION'
      - '.github/workflows/physical-interactions.yml'
concurrency:
  group: physical-interactions-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  browser-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright pillow httpx
          python -m playwright install --with-deps chromium
      - name: Verify interaction state transitions
        run: node tests/integration/physical_interactions.cjs
      - name: Build the playable game
        run: |
          python build.py
          python tools/package_cloudflare_2d.py build/yahaeng_city.html
      - name: Browser regression and native keyboard/touch playback
        env:
          PYTHONPATH: ${{ github.workspace }}/tests/support:${{ github.workspace }}/tests/tutorial
          YH_TEST_HTTP: '1'
          YH_OPENING_DIR: ${{ github.workspace }}/build/physical-v190/opening
          YH_VIP_DIR: ${{ github.workspace }}/build/physical-v190/vip
        run: |
          python -m http.server 8001 --bind 127.0.0.1 > "$RUNNER_TEMP/yahaeng-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          python - <<'PY'
          import subprocess,sys
          names=['t_contract_density','t_environment_targets','t_mobile_flow','t_physical_interactions']
          failed=[]
          for name in names:
              r=subprocess.run([sys.executable,'tests/rev/'+name+'.py'])
              if r.returncode:failed.append(name)
          if failed:raise SystemExit('Focused failures: '+', '.join(failed))
          PY
          python tools/run_tests.py --fast --quick --no-build
          python tests/tutorial/room_finish_live.py --url http://127.0.0.1:8001/public/
          python tools/capture_ink_interface.py after --out build/ink-v199
      - name: Package the exact tested build
        run: python tools/package_cloudflare_2d.py build/yahaeng_city.html
      - name: Save review evidence and packaged assets on this PR
        if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/physical-interactions-v190'
        env:
          REVIEW_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          src=Path('build/physical-v190/live');out=Path('docs/physical-v190');out.mkdir(exist_ok=True)
          for name in ['pc-skill-reminder','mobile-skill-reminder','pc-body-knockout','mobile-body-knockout','pc-body-hidden','mobile-body-hidden']:
              p=src/(name+'.png')
              if p.exists():
                  image=Image.open(p);image.thumbnail((1100,850));image.save(out/(name+'.png'),optimize=True)
          for p in src.glob('*.json'):(out/p.name).write_bytes(p.read_bytes())
          for p in Path('build/physical-v190').glob('*.png'):
              image=Image.open(p);image.thumbnail((1100,850));image.save(out/p.name,optimize=True)
          for p in Path('build/physical-v190/vip').glob('*.json'):(out/p.name).write_bytes(p.read_bytes())
          PY
          git add public docs/physical-v190
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Package verified v190 build and native playback evidence'
            git push origin HEAD:"$REVIEW_BRANCH"
          fi
      - name: Print failed scene details
        if: failure()
        run: |
          python - <<'PY'
          from pathlib import Path
          for p in sorted(Path('build/test_logs').glob('*.log')):
              text=p.read_text()
              if 'Traceback' in text or 'AssertionError' in text:
                  print(str(p)+'\\n'+text[-14000:])
          PY
      - name: Upload all verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physical-interactions-${{ github.run_id }}
          path: |
            build/test_logs/
            build/light-room-v201/
            build/tutorial-v202/
            build/tutorial-validation/
            build/physical-v190/
            build/action-flow-v192/
            build/interface-v193/
            build/first-night-v194/
            build/growth-v195/
            build/field-v196/
            build/beginner-v197/
            build/linear-v198/
            build/ink-v199/
            build/newgame-v200/
            public/version.json
          retention-days: 7

  native-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        device: [pc, mobile]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright pillow httpx
          python -m playwright install --with-deps chromium
      - name: Build the same playable package
        run: |
          python build.py
          python tools/package_cloudflare_2d.py build/yahaeng_city.html
      - name: Native linear journey, interactions and advanced missions
        env:
          PYTHONPATH: ${{ github.workspace }}/tests/support:${{ github.workspace }}/tests/tutorial
          YH_TEST_HTTP: '1'
          REVIEW_DEVICE: ${{ matrix.device }}
        run: |
          python -m http.server 8001 --bind 127.0.0.1 > "$RUNNER_TEMP/yahaeng-native-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          python tests/tutorial/first_steps_live.py --device "$REVIEW_DEVICE" --out build/linear-v198/first-live
          python tests/tutorial/beginner_live.py --device "$REVIEW_DEVICE" --url http://127.0.0.1:8001/public/ --out build/linear-v198/beginner
          python tests/tutorial/first_night_live.py --device "$REVIEW_DEVICE" --url http://127.0.0.1:8001/public/ --out build/linear-v198/first-night
          python tests/tutorial/field_learning_live.py --device "$REVIEW_DEVICE" --url http://127.0.0.1:8001/public/ --out build/linear-v198/field
          python tests/tutorial/growth_live.py --device "$REVIEW_DEVICE" --url http://127.0.0.1:8001/public/ --out build/linear-v198/growth
          python tests/tutorial/action_flow_live.py --device "$REVIEW_DEVICE" --url http://127.0.0.1:8001/public/ --out build/linear-v198/action
          if [ "$REVIEW_DEVICE" = pc ]; then
            YH_REALTIME=1 YH_DEVICE=pc YH_PREP_SKILLS=1 YH_VIP_DIR=build/linear-v198/vip python tests/tutorial/vip_choices_walk.py http://127.0.0.1:8001/public/ v198 smoke
          fi
      - name: Package the exact tested build
        run: python tools/package_cloudflare_2d.py build/yahaeng_city.html
      - name: Upload native playback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.device }}-${{ github.run_id }}
          path: |
            build/linear-v198/
            public/version.json
          retention-days: 7
