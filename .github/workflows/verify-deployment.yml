name: Verify public game deployment
on:
  push:
    branches: [main]
    paths: ['public/version.json', '.github/workflows/verify-deployment.yml']
permissions:
  contents: read
concurrency:
  group: verify-public-game
  cancel-in-progress: true
jobs:
  public-browser-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser verification dependencies
        run: |
          python -m pip install playwright httpx
          python -m playwright install --with-deps chromium
      - name: Wait for both production packages
        run: |
          python - <<'PY'
          import hashlib,json,time,httpx
          from pathlib import Path
          root=Path('public');expected=json.loads((root/'version.json').read_text())
          urls={'workers':'https://yahaeng.kkhkkh-20.workers.dev/','pages':'https://kkhkkh20-bit.github.io/yahaeng/'}
          ready={}
          with httpx.Client(timeout=20,follow_redirects=True) as client:
              for attempt in range(80):
                  for name,url in urls.items():
                      if name in ready:continue
                      try:
                          r=client.get(url+'version.json',params={'check':time.time_ns()});r.raise_for_status()
                          if r.json()!=expected:continue
                          r=client.get(url+'index.html',params={'check':time.time_ns()});r.raise_for_status()
                          if hashlib.sha256(r.content).digest()!=hashlib.sha256((root/'index.html').read_bytes()).digest():continue
                          ready[name]={'url':url,'version':expected['version'],'source_sha256':expected['source_sha256']}
                          print('READY',name,expected['version'],flush=True)
                      except Exception as error:
                          if attempt%5==0:print('WAIT',name,type(error).__name__,flush=True)
                  if len(ready)==len(urls):break
                  time.sleep(3)
          Path('build/public-deployment-proof.json').write_text(json.dumps(ready,indent=2))
          if len(ready)!=len(urls):raise SystemExit('Both tested production packages are not ready')
          PY
      - name: Verify Workers hashes and native desktop/mobile input
        run: python tests/tutorial/verify_deployment.py https://yahaeng.kkhkkh-20.workers.dev/ workers --plain
      - name: Verify Pages hashes and native desktop/mobile input
        run: python tests/tutorial/verify_deployment.py https://kkhkkh20-bit.github.io/yahaeng/ pages --plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-game-verification-${{ github.run_id }}
          path: |
            build/public-deployment-proof.json
            build/tutorial-validation/
          retention-days: 7
