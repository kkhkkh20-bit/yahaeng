name: Verify public game deployment
on:
  push:
    branches: [main]
    paths: ['public/version.json', '.github/workflows/verify-deployment.yml']
permissions:
  contents: read
concurrency:
  group: verify-public-game
  cancel-in-progress: true
jobs:
  public-browser-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: workers
            origin: https://yahaeng.kkhkkh-20.workers.dev/
          - target: pages
            origin: https://kkhkkh20-bit.github.io/yahaeng/
    env:
      VERIFY_TARGET: ${{ matrix.target }}
      VERIFY_ORIGIN: ${{ matrix.origin }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser verification dependencies
        run: |
          python -m pip install playwright httpx
          python -m playwright install --with-deps chromium
      - name: Wait for the tested production package
        run: |
          python - <<'PY'
          import hashlib,json,os,time,httpx
          from pathlib import Path
          root=Path('public');expected=json.loads((root/'version.json').read_text())
          urls={os.environ['VERIFY_TARGET']:os.environ['VERIFY_ORIGIN']}
          ready={}
          with httpx.Client(timeout=20,follow_redirects=True) as client:
              for attempt in range(60):
                  for name,url in urls.items():
                      if name in ready:continue
                      try:
                          r=client.get(url+'version.json',params={'check':time.time_ns()});r.raise_for_status()
                          actual=r.json()
                          if actual!=expected:
                              if attempt%10==0:print('WAIT',name,'expected',expected['version'],'observed',actual.get('version'),actual.get('source_sha256'),flush=True)
                              continue
                          r=client.get(url+'index.html',params={'check':time.time_ns()});r.raise_for_status()
                          if hashlib.sha256(r.content).digest()!=hashlib.sha256((root/'index.html').read_bytes()).digest():continue
                          ready[name]={'url':url,'version':expected['version'],'source_sha256':expected['source_sha256']}
                          print('READY',name,expected['version'],flush=True)
                      except Exception as error:
                          if attempt%5==0:print('WAIT',name,type(error).__name__,flush=True)
                  if len(ready)==len(urls):break
                  time.sleep(3)
          Path('build/public-deployment-proof.json').write_text(json.dumps(ready,indent=2))
          if len(ready)!=len(urls):raise SystemExit('Tested production package is not ready')
          PY
      - name: Verify package hashes and native desktop/mobile input
        run: python tests/tutorial/verify_deployment.py "$VERIFY_ORIGIN" "$VERIFY_TARGET" --plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-game-verification-${{ matrix.target }}-${{ github.run_id }}
          path: |
            build/public-deployment-proof.json
            build/tutorial-validation/
          retention-days: 7
