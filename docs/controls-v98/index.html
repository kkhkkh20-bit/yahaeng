<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>야행 v98 · 조작과 대화</title><style>*{box-sizing:border-box}body{margin:0;background:#eee4cf;color:#171817;font:15px/1.6 system-ui,sans-serif}main{max-width:1280px;padding:24px 16px;margin:auto}h1{font-size:28px}p{color:#565044}a{color:#94382b}nav{display:flex;gap:8px;flex-wrap:wrap}button{cursor:pointer;border:1px solid #8f8064;background:transparent;min-height:44px;padding:8px 14px;font:inherit}button[aria-pressed=true]{background:#171817;color:#eee4cf}.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}figure{margin:0}figcaption{margin:8px 0;font-size:13px}img{display:block;width:100%;border:1px solid #8f8064}.mobile img{max-width:390px;margin:auto}@media(max-width:760px){.pair{grid-template-columns:1fr}}</style><main><h1>야행 v98 · 조작과 대화</h1><p>살피기 제거 · 메뉴 상단 이동 · 행동을 가리지 않는 말풍선 · 이전 인게임 초상 복원</p><p><a href="../tone-study/game.html?v=98">잉크 시안 플레이</a> · <a href="../?v=98">기본 버전 플레이</a></p><nav><button data-scene="play">플레이</button><button data-scene="dialog">대화</button><button data-view="pc">PC</button><button data-view="mobile">모바일</button></nav><div id="pair" class="pair"><figure><figcaption>이전 잉크 시안 v97</figcaption><a id="beforeLink"><img id="before"></a></figure><figure><figcaption>수정 v98</figcaption><a id="afterLink"><img id="after"></a></figure></div><p>같은 인물·카메라 배치의 브라우저 화면입니다. 이미지를 누르면 원본을 볼 수 있습니다.</p></main><script>let scene='play',view=innerWidth<=700?'mobile':'pc';function render(){for(const when of ['before','after']){const src=scene+'-'+when+(view==='mobile'?'-mobile':'')+'.png';document.getElementById(when).src=src;document.getElementById(when).alt=(when==='before'?'이전':'수정')+' '+scene+' '+view;document.getElementById(when+'Link').href=src;}document.getElementById('pair').classList.toggle('mobile',view==='mobile');document.querySelectorAll('[data-scene]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.scene===scene)));document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===view)));}document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>{scene=b.dataset.scene;render()});document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});render();</script></html>
