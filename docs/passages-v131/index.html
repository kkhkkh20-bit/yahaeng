<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>야행 · 우회 경로와 출입 동작</title><style>body{margin:0;background:#182126;color:#e6e1d4;font:16px/1.7 system-ui}main{max-width:1120px;margin:auto;padding:30px 18px}h1{font-size:30px}a{color:#e4c68e}nav{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:24px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}figure{margin:0;background:#10191d;padding:12px}img{width:100%;height:430px;object-fit:contain}figcaption{padding-top:10px}p{max-width:850px}@media(max-width:650px){.grid{grid-template-columns:1fr}img{height:auto;max-height:650px}}</style><main><h1>우회 경로와 출입 동작</h1><p>골목 앞뒤를 잇는 맨홀 2개와 외벽·실내 환풍구 3개를 연결했습니다. 통로 안에서는 전용 미니맵으로 출구를 찾으며 이동합니다.</p><nav><a href="../club-study/?v=131">새 구역 플레이</a><a href="https://github.com/kkhkkh20-bit/yahaeng/blob/main/docs/PASSAGES_V131.md">경로 기획·검수 기록</a><a href="https://yahaeng.kkhkkh-20.workers.dev/">기존 2D 테스트</a></nav><div class="grid"><figure><a href="passage-mobile-well-entry.png"><img src="passage-mobile-well-entry.png" loading="lazy" alt="맨홀 · 뚜껑을 열고 은신"></a><figcaption>맨홀 · 뚜껑을 열고 은신</figcaption></figure><figure><a href="passage-mobile-sewer.png"><img src="passage-mobile-sewer.png" loading="lazy" alt="지하 수로 · 사다리로 다른 골목에 나가기"></a><figcaption>지하 수로 · 사다리로 다른 골목에 나가기</figcaption></figure><figure><a href="passage-mobile-vent-entry.png"><img src="passage-mobile-vent-entry.png" loading="lazy" alt="환풍 통로 · 실내로 우회"></a><figcaption>환풍 통로 · 실내로 우회</figcaption></figure><figure><a href="passage-pc-vent-pull.png"><img src="passage-pc-vent-pull.png" loading="lazy" alt="환풍구 기습 · 짧게 기절 / 길게 처치"></a><figcaption>환풍구 기습 · 짧게 기절 / 길게 처치</figcaption></figure><figure><a href="passage-pc-switch.png"><img src="passage-pc-switch.png" loading="lazy" alt="벽 스위치 · 손과 판정 위치 일치"></a><figcaption>벽 스위치 · 손과 판정 위치 일치</figcaption></figure></div><p>동작 중 발을 고정하고, 캐릭터가 포즈 전환에서 아래로 튀던 보정을 제거했습니다. 맨홀 시체 보관·회수와 복장 변경 후 출입도 확인했습니다.</p><p>PC·터치 입력, AI가 움직이는 실제 경로 검증과 출입 자세 샘플 검증을 함께 진행했습니다. 이 화면은 클럽 대표 구역이며 전체 의뢰 지도는 기존 2D 테스트에 있습니다.</p></main></html>
