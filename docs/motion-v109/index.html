<main><h1>은신과 낙하 동작 · v109</h1><p><a href="../tone-study/game.html?v=109">게임 실행</a> · <a href="https://github.com/kkhkkh20-bit/yahaeng/blob/main/docs/STORAGE_MOTION.md">점검 기록</a></p>
<nav aria-label="확인할 동작"><button data-scene="box">수거함 전후</button><button data-scene="well">맨홀</button><button data-scene="wardrobe">옷장</button><button data-scene="locker">사물함</button><button data-scene="bed">침대 밑</button><button data-scene="bush">화단</button><button data-scene="drop">뛰어내리기</button><button data-scene="ledge-kill">매달려 끌어내리기</button></nav>
<p id="note"></p><div class="pair"><figure id="previous"><figcaption>이전 v108</figcaption><video id="before" muted loop playsinline controls preload="metadata" src="box-before.mp4"></video></figure><figure><figcaption>수정 v109</figcaption><video id="after" muted loop playsinline controls preload="metadata"></video></figure></div>
<small>실제 게임을 Chromium 모바일 화면(390×844)에서 실행해 기록했습니다. 동작 부분을 확대해 24fps로 보여 줍니다. 수거함 전후 영상은 같은 위치와 시작 조건입니다.</small></main>
<script>
const notes={box:'뚜껑 열기 → 몸을 넘겨 들어가기 → 닫기 → 다시 나오는 동작을 이어 붙였습니다.',well:'구멍에 들어가고 나올 때 몸 위치와 가려지는 경계가 이어집니다.',wardrobe:'문을 열고 안으로 들어간 뒤 닫습니다. 출구는 실제 가구 크기로 찾습니다.',locker:'몸을 낮춰 들어가고, 열린 문으로 나옵니다.',bed:'침대 옆으로 접근해 몸을 낮추고 침대 밑으로 들어갑니다.',bush:'몸을 낮춰 화단에 들어간 뒤 빈 공간으로 나옵니다.',drop:'매달린 손을 놓고 아래층으로 내려와 착지합니다.',"ledge-kill":'공격 버튼을 1초간 유지하면 위의 적을 끌어내립니다. 적이 착지한 뒤 추락사로 처리하며, 주인공은 매달린 자리에 남습니다.'};
function select(scene){for(const b of document.querySelectorAll('[data-scene]'))b.setAttribute('aria-pressed',String(b.dataset.scene===scene));document.getElementById('note').textContent=notes[scene];const before=document.getElementById('before'),after=document.getElementById('after');document.getElementById('previous').hidden=scene!=='box';before.pause();before.currentTime=0;after.src=scene+'.mp4';after.play().catch(()=>{});if(scene==='box')before.play().catch(()=>{});}
document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>select(b.dataset.scene));select('box');
</script></html>
