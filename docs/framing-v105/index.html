<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>야행 v105 · 내 캐릭터 가독성</title><style>*{box-sizing:border-box}body{margin:0;background:#eee4cf;color:#171817;font:15px/1.65 system-ui,sans-serif}main{max-width:1280px;margin:auto;padding:24px 16px}h1{font-size:28px;margin:0 0 12px}p{color:#625a49}a{color:#94382b}nav{display:flex;gap:8px;flex-wrap:wrap}button{font:inherit;padding:8px 14px;min-height:44px;cursor:pointer;background:none;border:1px solid #8f8064}button[aria-pressed=true]{background:#171817;color:#eee4cf}.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}figure{margin:0}figcaption{font-size:13px;margin:8px 0}img{display:block;width:100%;border:1px solid #8f8064}.mobile img{max-width:390px;margin:auto}details{margin-top:24px}summary{cursor:pointer;padding:8px 0}@media(max-width:760px){.pair{grid-template-columns:1fr}}</style><main><h1>내 캐릭터 가독성 · v105</h1><p>모바일 시점을 조금 가까이 잡고, 내 캐릭터의 위치·윤곽·방향이 먼저 보이게 했습니다.</p><p><a href="../tone-study/game.html?v=104">잉크 시안 플레이</a> · <a href="../?v=104">기본 버전 플레이</a></p><nav><button data-scene="street">내 캐릭터</button><button data-scene="grab">붙잡기</button><button data-scene="grab-close">동작 확대</button><button data-scene="search">수색 표시</button><button data-w="390">모바일 세로</button><button data-w="844">모바일 가로</button><button data-w="1280">PC</button></nav><p id="note"></p><div class="pair" id="pair"><figure><figcaption>이전 v104</figcaption><a id="beforeLink"><img id="before"></a></figure><figure><figcaption>수정 v105</figcaption><a id="afterLink"><img id="after"></a></figure></div><p>같은 위치·배치를 사용한 브라우저 화면입니다. 붙잡기는 실제 행동을 진행한 장면입니다. 이미지를 누르면 원본을 볼 수 있습니다.</p></main><script>const copy={street:'세로 화면의 발 위치는 높이의 약 60%. 기본 시점에서 몸이 약 20% 크게 보이고, 작은 발밑 표식과 방향 표시가 붙습니다.',grab:'실제 붙잡기 동작입니다. 같은 자세·프레임에 맞춘 윤곽으로 내 몸을 구분합니다. 설명 박스는 추가하지 않았습니다.',"grab-close":'실제 붙잡기 장면을 확대해 윤곽과 팔의 움직임을 비교합니다.',search:'목격 지점의 사람 모양 복제를 지점 표식으로 바꿨습니다. 현재 캐릭터와 지나간 위치를 구분합니다.'};let scene='street',width=innerWidth<=700?'390':'1280';function render(){for(const when of ['before','after']){const src=scene+'-'+when+'-'+width+'.png';document.getElementById(when).src=src;document.getElementById(when).alt=(when==='before'?'이전':'수정')+' '+document.querySelector('[data-scene="'+scene+'"]').textContent+' '+width+'px';document.getElementById(when+'Link').href=src;}document.getElementById('pair').classList.toggle('mobile',width==='390');document.getElementById('note').textContent=copy[scene];document.querySelectorAll('[data-scene]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.scene===scene)));document.querySelectorAll('[data-w]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.w===width)));}document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>{scene=b.dataset.scene;render()});document.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{width=b.dataset.w;render()});render();</script></html>
