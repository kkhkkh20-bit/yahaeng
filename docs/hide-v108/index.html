<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>야행 · 수거함과 은신 동작 v108</title><style>*{box-sizing:border-box}body{margin:0;background:#eee4cf;color:#171817;font:15px/1.65 system-ui,sans-serif}main{max-width:1040px;margin:auto;padding:24px 16px}h1{font-size:28px;margin:0 0 12px}p{color:#625a49}a{color:#94382b}nav{display:flex;gap:8px;flex-wrap:wrap}button{font:inherit;padding:8px 14px;min-height:44px;cursor:pointer;background:none;border:1px solid #8f8064}button[aria-pressed=true]{background:#171817;color:#eee4cf}.pair{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}figure{margin:0}figcaption{font-size:13px;margin:8px 0}img,video{display:block;width:100%;max-width:390px;margin:auto;border:1px solid #8f8064}video{max-width:320px}details{margin-top:28px}summary{cursor:pointer;padding:8px 0}[hidden]{display:none!important}@media(max-width:700px){.pair{grid-template-columns:1fr}}</style><main><h1>수거함과 은신 동작 · v108</h1><p><a href="../tone-study/game.html?v=108">게임 실행</a> · <a href="https://github.com/kkhkkh20-bit/yahaeng/blob/main/docs/HIDE_INTERACTIONS.md">점검 기록</a></p><nav><button data-scene="enter">혼자 들어가기</button><button data-scene="stash">운반한 사람 넣기</button><button data-scene="drag">붙잡은 적과 들어가기</button><button data-scene="exit">나오기</button><button data-scene="idle">수거함 모양</button><button data-scene="inside">숨은 상태</button><button data-scene="well-enter">맨홀</button></nav><p id="note"></p><div class="pair"><figure><figcaption>이전 v107</figcaption><video id="beforeVideo" muted loop playsinline controls autoplay></video><a id="beforeLink"><img id="before" hidden></a></figure><figure><figcaption>수정 v108</figcaption><video id="afterVideo" muted loop playsinline controls autoplay></video><a id="afterLink"><img id="after" hidden></a></figure></div><p>같은 맵·시작 위치·배치의 실제 게임 화면입니다. 영상은 게임 내 확대 기능을 사용하고 동작 시간을 일정하게 진행해 24fps로 촬영했습니다. 동작 부분을 잘라 보여 주며, 사진을 누르면 전체 화면이 열립니다.</p></main><script>const copy={enter:'앞쪽 입구로 접근하고 뚜껑을 연 뒤, 몸을 넘겨 내려가고 닫습니다.',stash:'들고 있는 사람을 입구로 낮춰 넣은 뒤 운반 상태와 수용 인원을 갱신합니다. 주인공은 밖에 남습니다.',drag:'붙잡은 적을 먼저 끌어 넣고 주인공이 뒤따라 들어갑니다. 짧게 기절 · 같은 버튼을 길게 처치.',exit:'뚜껑을 열고 몸을 내민 뒤, 입력한 방향의 빈 공간으로 나와 닫습니다.',idle:'바퀴·넓은 입구·경첩·뚜껑·앞판이 있는 대형 수거함으로 바꿨습니다.',inside:'닫힌 수거함 위의 청록색 표식은 내 위치입니다. 중앙 상태에도 수거함 안임을 표시합니다.',"well-enter":'맨홀 뚜껑을 옆으로 열고 구멍 아래로 내려갑니다. 고정된 닫힌 뚜껑이 입구에 겹치지 않습니다.'};let scene='enter';function render(){const moving=['enter','stash','drag','exit'].includes(scene);for(const when of ['before','after']){const v=document.getElementById(when+'Video'),im=document.getElementById(when);v.hidden=!moving;im.hidden=moving;if(moving){v.src=scene+'-'+when+'.mp4';v.play().catch(()=>{});}else{v.pause();im.src=scene+'-close-'+when+'-390.png';im.alt=(when==='before'?'이전':'수정')+' '+document.querySelector('[data-scene="'+scene+'"]').textContent;document.getElementById(when+'Link').href=scene+'-'+when+'-390.png';}}document.getElementById('note').textContent=copy[scene];document.querySelectorAll('[data-scene]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.scene===scene)));}document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>{scene=b.dataset.scene;render()});render();</script></html>
