<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>야행 · 물체 색감과 조명 v111</title>
<style>*{box-sizing:border-box}body{margin:0;background:#eee4cf;color:#171817;font:15px/1.65 system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:24px 16px}h1{font-size:26px;margin:0 0 10px}a{color:#94382b}nav{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}button{font:inherit;min-height:44px;padding:8px 14px;border:1px solid #8f8064;background:none;cursor:pointer}button[aria-pressed=true]{background:#171817;color:#eee4cf}.pair{display:flex;justify-content:center;gap:20px;flex-wrap:wrap}figure{margin:0;flex:1;max-width:390px;min-width:270px}figcaption{margin:8px 0}img{display:block;width:100%;border:1px solid #8f8064}p,small{color:#625a49}label{display:block;padding:6px 0 16px}input{width:18px;height:18px;vertical-align:middle}small{display:block;margin-top:24px}</style>
<main><h1>물체 색감과 조명 · v111</h1><p><a href="../tone-study/game.html?v=111">게임 실행</a> · <a href="https://github.com/kkhkkh20-bit/yahaeng/blob/main/docs/STORAGE_MOTION.md">점검 기록</a></p>
<nav aria-label="비교할 물체"><button data-material="locker">사물함</button><button data-material="wardrobe">옷장</button><button data-material="box">수거함</button><button data-material="well">맨홀</button></nav>
<p id="note"></p><label><input id="opened" type="checkbox"> 문이 열린 상태 보기</label>
<div class="pair"><figure><figcaption>이전 v110</figcaption><a id="beforeLink"><img id="before"></a></figure><figure><figcaption>수정 v111</figcaption><a id="afterLink"><img id="after"></a></figure></div>
<small>같은 위치·조명·동작 단계에서 기록한 실제 게임 화면입니다. 기본 비교는 행동을 시작한 직후이며, 사진을 누르면 원본이 열립니다. Chromium 모바일 화면(390×844)으로 확인했습니다.</small></main>
<script>
const notes={locker:'금속의 밝은 파란색과 테두리를 낮추고, 움직이는 문에도 주변의 야간 조명을 적용했습니다.',wardrobe:'목재의 노란 기운과 채도를 줄였습니다. 문을 열 때도 옆의 가구와 같은 조명을 받습니다.',box:'밝은 녹색과 표식의 노란색을 차분한 회녹색으로 맞췄습니다. 뚜껑과 앞판에 같은 조명을 적용합니다.',well:'밝은 테두리와 뚜껑을 기존 금속 소품에 맞췄습니다. 열고 닫을 때 밝기가 갑자기 뛰지 않도록 했습니다.'};let material='locker';
function render(){const state=document.getElementById('opened').checked?'open':'active';document.getElementById('note').textContent=notes[material];for(const when of ['before','after']){const src=material+'-'+when+'-lit-'+state+'.png';document.getElementById(when).src=src;document.getElementById(when).alt=(when==='before'?'이전 ':'수정 ')+document.querySelector('[data-material="'+material+'"]').textContent;document.getElementById(when+'Link').href=src;}document.querySelectorAll('[data-material]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.material===material)));}
document.querySelectorAll('[data-material]').forEach(b=>b.onclick=()=>{material=b.dataset.material;render()});document.getElementById('opened').onchange=render;render();</script></html>
