<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>야행 · 문 전체 열림과 출입 속도 v110</title>
<style>*{box-sizing:border-box}body{margin:0;background:#eee4cf;color:#171817;font:15px/1.65 system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:24px 16px}h1{font-size:26px;margin:0 0 10px}a{color:#94382b}nav{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}button{font:inherit;min-height:44px;padding:8px 14px;border:1px solid #8f8064;background:none;cursor:pointer}button[aria-pressed=true]{background:#171817;color:#eee4cf}.pair{display:flex;justify-content:center;gap:20px;flex-wrap:wrap}figure{margin:0;flex:1;max-width:390px;min-width:270px}figcaption{margin:8px 0}video{display:block;width:100%;border:1px solid #8f8064}p{color:#625a49}[hidden]{display:none!important}small{display:block;margin-top:24px;color:#625a49}</style>
<main><h1>문 전체 열림과 출입 속도 · v110</h1><p><a href="../tone-study/game.html?v=109">게임 실행</a> · <a href="https://github.com/kkhkkh20-bit/yahaeng/blob/main/docs/STORAGE_MOTION.md">점검 기록</a></p>
<nav aria-label="확인할 동작"><button data-scene="locker">사물함</button><button data-scene="wardrobe">옷장</button><button data-scene="box">수거함 출입</button><button data-scene="drop">뛰어내리기</button><button data-scene="ledge-kill">적 끌어내리기</button></nav>
<p id="note"></p><div class="pair"><figure id="previous"><figcaption>이전 v109</figcaption><video id="before" muted loop playsinline controls preload="metadata" src="box-before.mp4"></video></figure><figure><figcaption>수정 v110</figcaption><video id="after" muted loop playsinline controls preload="metadata"></video></figure></div>
<small>실제 게임을 Chromium 모바일 화면(390×844)에서 실행해 기록했습니다. 동작 부분을 확대해 24fps로 보여 줍니다. 전후 영상은 같은 위치와 시작 조건입니다.</small></main>
<script>
const notes={box:'넘기와 하강을 한 곡선으로 연결하고, 입구 아래 이동 거리와 출입 시간을 줄였습니다.',locker:'사물함 위부터 아래까지 한 장의 문 전체가 열리고 닫힙니다.',wardrobe:'양쪽 문 전체가 열리며, 서서 걸어 들어가고 나옵니다.',drop:'손을 놓은 뒤 다시 솟거나 늘어지는 구간을 줄였습니다.',"ledge-kill":'잡아당기는 속도가 낙하로 이어집니다. 적만 떨어지고 주인공은 난간에 남습니다.'};
function select(scene){for(const b of document.querySelectorAll('[data-scene]'))b.setAttribute('aria-pressed',String(b.dataset.scene===scene));document.getElementById('note').textContent=notes[scene];const before=document.getElementById('before'),after=document.getElementById('after');document.getElementById('previous').hidden=false;before.src=scene+'-before.mp4';before.pause();before.currentTime=0;after.src=scene+'.mp4';after.play().catch(()=>{});before.play().catch(()=>{});}
document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>select(b.dataset.scene));select('locker');
</script></html>
