<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>야행 · 실내외 겹침과 계단 입구</title>
<style>*{box-sizing:border-box}body{margin:0;background:#101317;color:#e8e5dc;font:16px/1.6 system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:28px 18px}h1{font-size:24px;margin:0 0 8px}p{color:#bfc1bf}a{color:#ebcc83}nav{display:flex;gap:8px;margin:20px 0}button{font:inherit;padding:9px 16px;border:1px solid #555;background:#242b30;color:inherit;border-radius:4px;cursor:pointer}button[aria-selected=true]{background:#e1ce99;color:#171b1e;border-color:#e1ce99}.compare{display:grid;grid-template-columns:1fr 1fr;gap:20px}figure{margin:0}figcaption{padding:8px 0;font-weight:600}img{width:100%;height:auto;border:1px solid #34393d}footer{margin-top:24px}[hidden]{display:none}@media(max-width:560px){.compare{grid-template-columns:1fr}}</style>
<main><h1>실내외 겹침과 옥탑방 계단 입구</h1><p>같은 맵·좌표에서 촬영한 실제 게임 화면입니다. 버튼과 미니맵 위치는 유지했습니다.</p>
<nav role="tablist" aria-label="비교 장면"><button role="tab" id="tab-floor" aria-controls="floor" aria-selected="true" onclick="show('floor')">2층 실내</button><button role="tab" id="tab-roof" aria-controls="roof" aria-selected="false" onclick="show('roof')">옥상 계단 입구</button></nav>
<section id="floor" role="tabpanel" aria-labelledby="tab-floor"><p>방 안에 겹쳐 보이던 전선과 옥상 간판을 가렸습니다. 건물 밖 전선은 계속 보입니다.</p><div class="compare"><figure><figcaption>이전</figcaption><a href="before-floor.png"><img src="before-floor.png" width="620" height="920" alt="이전: 침실 위를 가로지르는 전선과 실외기 간판"></a></figure><figure><figcaption>수정</figcaption><a href="after-floor.png"><img src="after-floor.png" width="620" height="920" alt="수정: 외부 전선과 간판이 실내를 가리지 않는 침실"></a></figure></div></section>
<section id="roof" role="tabpanel" aria-labelledby="tab-roof" hidden><p>실제 진입 위치에 열린 철문·디딤판·계단 명판을 추가했습니다. 문 안으로 걸어 들어가면 내려갑니다.</p><div class="compare"><figure><figcaption>이전</figcaption><a href="before-roof.png"><img src="before-roof.png" width="620" height="920" alt="이전: 옆면 문이 잘 보이지 않는 옥탑방"></a></figure><figure><figcaption>수정</figcaption><a href="after-roof.png"><img src="after-roof.png" width="620" height="920" alt="수정: 열린 문과 디딤판, 계단 표시가 있는 실제 입구"></a></figure></div></section>
<footer><a href="../?v=89">게임 실행 · v89</a></footer></main><script>function show(id){for(const name of ['floor','roof']){document.getElementById(name).hidden=name!==id;document.getElementById('tab-'+name).setAttribute('aria-selected',String(name===id))}}</script></html>
